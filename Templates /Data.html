<!DOCTYPE html>

<html>
<head>
    <title>Dataset Form - Cloud Cost Optimization</title>

```
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
    }

    .navbar{
        background:#007bff;
        padding:15px;
        text-align:center;
    }

    .navbar a{
        color:white;
        text-decoration:none;
        margin:0 15px;
        font-weight:bold;
    }

    .container{
        width:600px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 10px #ccc;
    }

    h2{
        text-align:center;
        color:#007bff;
        margin-bottom:20px;
    }

    label{
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:10px;
        margin-top:5px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:12px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#0056b3;
    }
</style>
```

</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/data">Dataset Form</a>
</div>

<div class="container">

```
<h2>TESTING DATA PAGE</h2>

<form action="/data" method="POST">

    <label>Project Name</label>
    <input type="text" name="project_name" required>

    <label>Application Type</label>
    <select name="application_type" required>
        <option>Web Application</option>
        <option>Mobile Application</option>
        <option>AI/ML Application</option>
        <option>E-Commerce</option>
    </select>

    <label>Number of Users</label>
    <input type="number" name="users" required>

    <label>Storage Required (GB)</label>
    <input type="number" name="storage" required>

    <label>RAM Required (GB)</label>
    <input type="number" name="ram" required>

    <label>CPU Cores</label>
    <input type="number" name="cpu" required>

    <label>Monthly Budget (₹)</label>
    <input type="number" name="budget" required>

    <label>Free Tier Required</label>
    <select name="free_tier" required>
        <option>Yes</option>
        <option>No</option>
    </select>

    <button type="submit">Predict Best Cloud Service</button>

</form>
```

</div>

</body>
</html>
