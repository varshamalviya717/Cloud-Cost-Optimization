<!DOCTYPE html>
<html>
<head>
    <title>Login History</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#007bff;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        .btn{
            display:inline-block;
            margin-bottom:20px;
            padding:10px 15px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<a href="/dashboard" class="btn">Back to Dashboard</a>

<h1>Login History</h1>

<table>

<tr>
    <th>Email</th>
    <th>Login Time</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
